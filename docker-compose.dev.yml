version: '3.8'

services:
  haunted-asylum-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    ports:
      - "3001:3000"  # Changed from 3000:3000 to 3001:3000
    environment:
      - NODE_ENV=development
      - PORT=3000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - node_modules_cache:/app/node_modules
    restart: unless-stopped
    container_name: haunted-asylum-dev
    networks:
      - haunted-asylum-network
    stdin_open: true
    tty: true

volumes:
  node_modules_cache:

networks:
  haunted-asylum-network:
    driver: bridge